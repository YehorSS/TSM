# Релиз: по одному файлу на систему.
#   Windows — установщик TSM_x.y.z_x64-setup.exe и переносной TSM-portable.exe (без установки);
#   macOS   — один универсальный TSM_x.y.z_universal.dmg (Apple Silicon и Intel).
# Запуск: пуш тега v* (например v0.2.0) или вручную во вкладке Actions. Файлы — в черновике релиза.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - os: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - run: npm test
      - id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: TSM v__VERSION__
          releaseDraft: true
          args: ${{ matrix.args }}
      # переносная версия: тот же exe, что ставит установщик, — файлы интерфейса уже внутри него
      - if: startsWith(matrix.os, 'windows')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @src-tauri/target/release/tsm.exe \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=TSM-portable.exe"
